<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StudySprint — Productivity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
        <rect x="3" y="3" width="18" height="18" rx="4" fill="#0b76ff"/>
        <path d="M7 12h10M7 8h6" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>StudySprint</h1>
    </div>
    <div class="today-overview" id="todayOverview">Welcome — loading overview...</div>
  </header>

  <main class="container">
    <section class="card tasks-card">
      <div class="card-header">
        <h2>Tasks</h2>
        <div class="task-controls">
          <select id="taskFilter">
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
          </select>
          <button id="clearCompleted" class="link">Clear Completed</button>
        </div>
      </div>

      <form id="taskForm" class="task-form" aria-label="Add task">
        <input id="taskTitle" placeholder="New task title" required />
        <input id="taskDetails" placeholder="Details (optional)" />
        <button type="submit" class="btn">Add</button>
      </form>

      <ul id="taskList" class="task-list" aria-live="polite"></ul>
    </section>

    <section class="card timer-card">
      <div class="card-header"><h2>Pomodoro</h2></div>
      <div class="timer">
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="timer-controls">
          <button id="startBtn" class="btn primary">Start</button>
          <button id="pauseBtn" class="btn">Pause</button>
          <button id="resetBtn" class="btn">Reset</button>
        </div>
        <div class="session-indicator">
          <button id="focusBtn" class="seg active">Focus</button>
          <button id="breakBtn" class="seg">Break</button>
        </div>
      </div>
    </section>

    <section class="card goals-card">
      <div class="card-header"><h2>Goals</h2></div>
      <form id="goalForm" class="goal-form">
        <input id="goalTitle" placeholder="Add daily goal" required />
        <button type="submit" class="btn">Add</button>
      </form>
      <ul id="goalList" class="goal-list"></ul>
    </section>

    <section class="card stats-card">
      <div class="card-header"><h2>Statistics</h2></div>
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Total tasks</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statCompleted">0</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statRemaining">0</div>
          <div class="stat-label">Remaining</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statSessions">0</div>
          <div class="stat-label">Pomodoro sessions</div>
        </div>
        <div class="stat full-width">
          <div class="stat-value" id="statPercent">0%</div>
          <div class="stat-label">Daily productivity</div>
        </div>
      </div>
    </section>
  </main>

  <template id="taskTpl">
    <li class="task-item card-inner" data-id="">
      <label class="checkbox">
        <input type="checkbox" class="task-check" />
        <span class="checkmark"></span>
      </label>
      <div class="task-body">
        <div class="task-title" contenteditable="false"></div>
        <div class="task-details"></div>
      </div>
      <div class="task-actions">
        <button class="edit small">Edit</button>
        <button class="delete small">Delete</button>
      </div>
    </li>
  </template>

  <template id="goalTpl">
    <li class="goal-item card-inner" data-id="">
      <label class="goal-checkbox">
        <input type="checkbox" class="goal-check" />
        <span class="checkmark"></span>
      </label>
      <div class="goal-body">
        <div class="goal-title"></div>
      </div>
      <div class="goal-actions">
        <button class="delete small">Delete</button>
      </div>
    </li>
  </template>

  <audio id="notifySound" src="data:audio/mp3;base64,//uQZAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAACAAACcQCA..." preload="auto"></audio>

  <script src="script.js" defer></script>
</body>
</html>
